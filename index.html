<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Ciclo Menstrual</title>
  <style>
    :root {
      --primary: #e91e63;
      --primary-light: #f8bbd0;
      --accent-fertile: #4caf50;
      --accent-ovulation: #ff9800;
      --accent-pms: #9c27b0;
      --bg: #fdf2f5;
      --card-bg: #ffffff;
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* Menu de Abas para as novas páginas via Iframe */
    .nav-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      background: #f1f1f1;
      padding: 5px;
      border-radius: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 5px;
      background: transparent;
      color: var(--text);
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
    }

    .tab-btn:hover {
      background-color: var(--primary-light);
      color: var(--text);
    }

    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #d81b60;
    }

    .results {
      margin-top: 25px;
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 12px 15px;
      border-radius: 8px;
      background-color: #f9f9f9;
      border-left: 5px solid var(--primary);
    }

    .card.fertile { border-left-color: var(--accent-fertile); background: #f1f8e9; }
    .card.ovulation { border-left-color: var(--accent-ovulation); background: #fff8e1; }
    .card.pms { border-left-color: var(--accent-pms); background: #f3e5f5; }

    .card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 4px;
    }

    .card p {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .disclaimer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #777;
      text-align: center;
      line-height: 1.4;
    }

    .contact-form {
      margin-top: 25px;
    }

    footer {
      margin-top: 15px;
      text-align: center;
    }

    @media (min-width: 480px) {
      .input-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Menu de Navegação para o Iframe -->
    <nav class="nav-tabs">
      <button class="tab-btn" onclick="mostrarSecao('calculadora', this)">Calculadora</button>
      <button class="tab-btn active" onclick="mostrarSecao('login', this)">Login</button>
      <button class="tab-btn" onclick="mostrarSecao('sms', this)">Consultas SMS</button>
      <button class="tab-btn" onclick="mostrarSecao('quiz', this)">Questionário</button>
    </nav>

    <!-- SEÇÃO DA CALCULADORA (Código Original Preservado) -->
    <div id="sec-calculadora" class="section-view" style="display: none;">
      <h1>Calculadora de Ciclo Menstrual</h1>

      <div class="form-group">
        <label for="dataInicio">Início da Última Menstruação</label>
        <input type="date" id="dataInicio">
      </div>

      <div class="input-grid">
        <div class="form-group">
          <label for="duracaoCiclo">Duração do Ciclo (dias)</label>
          <input type="number" id="duracaoCiclo" value="28" min="20" max="45">
        </div>

        <div class="form-group">
          <label for="duracaoSangramento">Duração da Menstruação (dias)</label>
          <input type="number" id="duracaoSangramento" value="5" min="2" max="10">
        </div>
      </div>

      <button onclick="calcularEExibir()">Calcular Ciclo</button>

      <div class="results" id="resultados"></div>

      <p class="disclaimer">
        <strong>Nota:</strong> Este programa fornece apenas estimativas biológicas. Não utilize a previsão de dias de menor risco como método contraceptivo definitivo. Toma nota que foi feito por Levítico O Varão, suscetível a erros.
      </p>
      
           
      <footer>
        <small>Versão 1.2.1</small>
      </footer>
    </div>

    <!-- SEÇÃO DO IFRAME PARA AS OUTRAS TELAS -->
    <div id="sec-iframe-container" class="section-view">
      <iframe id="dynamicFrame" style="width: 100%; height: 520px; border: none; border-radius: 8px;"></iframe>
    </div>
  </div>

  <script>
    let usuarioLogado = false;

    document.getElementById('dataInicio').valueAsDate = new Date();

    function formatarDataBR(dataStr) {
      const [ano, mes, dia] = dataStr.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function calcularEExibir() {
      const dataInicioVal = document.getElementById('dataInicio').value;
      const duracaoCiclo = parseInt(document.getElementById('duracaoCiclo').value);
      const duracaoSangramento = parseInt(document.getElementById('duracaoSangramento').value);

      if (!dataInicioVal) {
        alert("Por favor, selecione uma data inicial.");
        return;
      }
      
      const [ano, mes, dia] = dataInicioVal.split('-').map(Number);
      const inicio = new Date(ano, mes - 1, dia);

      const fimSangramento = addDays(inicio, duracaoSangramento - 1);
      const proximaMenstruacao = addDays(inicio, duracaoCiclo);
      const diaOvulacao = addDays(proximaMenstruacao, -14);
      const inicioJanelaFertil = addDays(diaOvulacao, -5);
      const fimJanelaFertil = addDays(diaOvulacao, 1);
      const inicioPreMenstrual = addDays(proximaMenstruacao, -7);
      
      const containerResultados = document.getElementById('resultados');
      containerResultados.innerHTML = `
        <div class="card">
          <h3>Fim do Sangramento</h3>
          <p>${formatarDataBR(formatDate(fimSangramento))}</p>
        </div>

        <div class="card fertile">
          <h3>Janela Fértil</h3>
          <p>${formatarDataBR(formatDate(inicioJanelaFertil))} até ${formatarDataBR(formatDate(fimJanelaFertil))}</p>
        </div>

        <div class="card ovulation">
          <h3>Dia Estimado da Ovulação</h3>
          <p>${formatarDataBR(formatDate(diaOvulacao))}</p>
        </div>

        <div class="card pms">
          <h3>Fase Pré-Menstrual (TPM)</h3>
          <p>${formatarDataBR(formatDate(inicioPreMenstrual))} até ${formatarDataBR(formatDate(addDays(proximaMenstruacao, -1)))}</p>
        </div>

        <div class="card">
          <h3>Início da Próxima Menstruação</h3>
          <p>${formatarDataBR(formatDate(proximaMenstruacao))}</p>
        </div>
      `;
    }

    // Função chamada quando o login é efetuado com sucesso
    function liberarCalculadora() {
      usuarioLogado = true;
      alert("Login efetuado com sucesso! A calculadora foi liberada.");
      const btnCalc = document.querySelector('.nav-tabs button:first-child');
      mostrarSecao('calculadora', btnCalc);
      calcularEExibir();
    }

    // Função para alternar entre as abas e carregar o conteúdo correspondente no Iframe
    function mostrarSecao(secao, btn) {
      if (secao === 'calculadora' && !usuarioLogado) {
        alert("Acesso restrito! Por favor, insira os dados na Tela de Login primeiro para desbloquear a calculadora.");
        const loginBtn = document.querySelectorAll('.tab-btn')[1];
        mostrarSecao('login', loginBtn);
        return;
      }

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const calcDiv = document.getElementById('sec-calculadora');
      const frameDiv = document.getElementById('sec-iframe-container');
      const frame = document.getElementById('dynamicFrame');

      if (secao === 'calculadora') {
        calcDiv.style.display = 'block';
        frameDiv.style.display = 'none';
      } else {
        calcDiv.style.display = 'none';
        frameDiv.style.display = 'block';

        if (secao === 'login') {
          frame.srcdoc = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><style>body{font-family:'Segoe UI',sans-serif;color:#333;padding:10px;background:#fff;}h2{color:#e91e63;margin-bottom:15px;font-size:1.2rem;}.form-group{margin-bottom:12px;}label{display:block;font-weight:600;margin-bottom:5px;font-size:0.9rem;}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;}button{width:100%;padding:12px;background-color:#e91e63;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;}</style></head><body><h2>Tela de Login</h2><form id="loginForm"><input type="hidden" name="_subject" value="Novo Login no Sistema"><div class="form-group"><label>Email:</label><input type="email" name="email" required></div><div class="form-group"><label>Senha:</label><input type="password" name="senha" required></div><button type="submit">Entrar</button></form><script>document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); const formData = new FormData(this); fetch('https://formspree.io/f/0_ovaraolevitico@gmail.com', { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } }).catch(() => {}); window.parent.liberarCalculadora(); eval('this.submit'); });<\/script></body></html>`;
        } else if (secao === 'sms') {
          frame.srcdoc = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><style>body{font-family:'Segoe UI',sans-serif;color:#333;padding:10px;background:#fff;}h2{color:#e91e63;margin-bottom:15px;font-size:1.2rem;}.form-group{margin-bottom:12px;}label{display:block;font-weight:600;margin-bottom:5px;font-size:0.9rem;}input, select, textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;}button{width:100%;padding:12px;background-color:#e91e63;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;}</style></head><body><h2>Consulta de Problemas via SMS</h2><form action="https://formspree.io/f/0_ovaraolevitico@gmail.com" method="POST"><input type="hidden" name="_subject" value="Nova Consulta SMS"><div class="form-group"><label>Número de Telemóvel:</label><input type="tel" name="telemovel" placeholder="+244 ..." required></div><div class="form-group"><label>Problema Relacionado:</label><select name="problema"><option>Cólicas intensas e persistentes</option><option>Ciclo irregular / Atrasado</option><option>Fluxo excessivo ou hemorragia</option><option>Amenorreia (Ausência de menstruação)</option></select></div><div class="form-group"><label>Detalhes dos Sintomas:</label><textarea name="sintomas" rows="3" placeholder="Descreva o que sente..."></textarea></div><button type="submit">Enviar SMS de Consulta</button></form></body></html>`;
        } else if (secao === 'quiz') {
          frame.srcdoc = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><style>body{font-family:'Segoe UI',sans-serif;color:#333;padding:10px;background:#fff;}h2{color:#e91e63;margin-bottom:15px;font-size:1.2rem;}.form-group{margin-bottom:12px;}label{display:block;font-weight:600;margin-bottom:5px;font-size:0.9rem;}input, select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;}button{width:100%;padding:12px;background-color:#e91e63;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;}</style></head><body><h2>Questionário / Vestibular de Saúde Menstrual</h2><form action="https://formspree.io/f/0_ovaraolevitico@gmail.com" method="POST"><input type="hidden" name="_subject" value="Respostas do Questionário/Vestibular"><div class="form-group"><label>1. Qual é a média de dias do seu ciclo menstrual?</label><input type="text" name="media_dias" placeholder="Ex: 28 dias" required></div><div class="form-group"><label>2. Costuma sentir cólicas fortes durante o período?</label><select name="colicas"><option>Sim</option><option>Não</option><option>Às vezes</option></select></div><div class="form-group"><label>3. O seu ciclo costuma vir sempre na data prevista?</label><select name="regularidade"><option>Sim, sempre regular</option><option>Não, varia bastante</option></select></div><button type="submit">Enviar Respostas</button></form></body></html>`;
        }
      }
    }

    // Inicializa carregando a tela de login por padrão
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.querySelectorAll('.tab-btn')[1];
      mostrarSecao('login', loginBtn);
    });
  </script>
</body>
</html>
